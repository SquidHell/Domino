<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Domino 2048</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
  /* ---- palette 2048 d'origine ----
     Le fond crème, le plateau taupe, les cases ivoire et les boutons bruns
     viennent du jeu de Gabriele Cirulli ; les tuiles gardent ses valeurs exactes.
     Les angles restent volontairement peu arrondis (3 px), comme à l'époque. */
  :root{
    color-scheme:light;      /* une seule ambiance, celle du 2048 d'origine */
    --ground:#faf8ef;
    --panel:#eee4da;
    --board:#bbada0;
    --cell-bg:rgba(238,228,218,.35);
    --ghost-line:rgba(119,110,101,.55);
    --ink:#776e65;
    --ink-2:#8d8378;
    --muted:#a89e94;
    --line:rgba(119,110,101,.18);
    --btn:#8f7a66;
    --btn-ink:#f9f6f2;
    --danger:#c05a45;
    --veil:rgba(238,228,218,.86);
    --veil-ink:#776e65;
    --score-label:#eee4da;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--ground);
    color:var(--ink);
    font-family:Rubik,"Clear Sans","Helvetica Neue",Arial,sans-serif;
    font-size:15px;
    display:flex;flex-direction:column;align-items:center;
    padding:22px 14px 40px;
    min-height:100vh;
  }
  :focus-visible{outline:3px solid var(--btn);outline-offset:2px}
  .wrap{width:min(94vw,470px);display:flex;flex-direction:column;gap:13px}

  /* ---- en-tête ---- */
  header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .brand h1{
    font-weight:800;font-size:clamp(29px,8vw,45px);line-height:1;margin:0;
    letter-spacing:-1.1px;color:var(--ink);
  }
  .brand p{
    margin:8px 0 0;font-size:12px;font-weight:500;letter-spacing:.04em;
    color:var(--ink-2);
  }
  .scores{display:flex;gap:6px;flex:none}
  .score{
    background:var(--board);border-radius:3px;padding:6px 14px;text-align:center;min-width:74px;
  }
  .score span{
    display:block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    color:var(--score-label);
  }
  .score b{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;color:#fff}

  /* ---- bandeau de jeu ---- */
  .panel{
    display:flex;align-items:center;gap:14px;
    background:var(--panel);border-radius:5px;padding:12px 13px;
  }
  .lbl{
    font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin-bottom:6px;
  }
  .slot{display:flex;flex-direction:column;align-items:center}
  .slot.next{opacity:.85}
  /* le domino : plaque posée, moitiés séparées par la rainure */
  .piece{display:flex;gap:4px;padding:4px;border-radius:4px;background:var(--board)}
  .piece.vert{flex-direction:column}
  .half{
    width:38px;height:38px;border-radius:3px;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:18px;font-variant-numeric:tabular-nums;
  }
  .piece.small{padding:3px;gap:3px}
  .piece.small .half{width:24px;height:24px;font-size:12px}
  .arrowhint{font-size:16px;color:var(--muted);margin-top:5px;height:18px;font-weight:700}

  button{
    font-family:inherit;font-weight:700;font-size:13px;
    border-radius:3px;padding:9px 14px;cursor:pointer;border:0;
    background:var(--btn);color:var(--btn-ink);
  }
  button:hover:not([disabled]){filter:brightness(1.09)}
  button:active:not([disabled]){transform:translateY(1px)}
  button[disabled]{opacity:.4;cursor:default}
  /* l'action principale : gros bouton, à portée de pouce */
  #rotate{
    margin-left:auto;align-self:stretch;min-width:132px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:15px;font-weight:800;letter-spacing:.01em;padding:12px 18px;
  }
  #rotate .glyph{font-size:26px;line-height:1;font-weight:400}
  @media (max-width:400px){ #rotate{min-width:104px;padding:10px 12px} }

  /* ---- barre d'état et actions ---- */
  .bar{display:flex;align-items:center;gap:10px;min-height:24px;flex-wrap:wrap}
  .status{flex:1;font-size:13px;font-weight:500;margin:0;color:var(--ink-2);min-width:150px}
  .status.warn{color:var(--danger);font-weight:700}
  .status.good{color:var(--btn);font-weight:700}
  .acts{display:flex;gap:6px;margin-left:auto}
  .acts button{
    background:transparent;color:var(--muted);border:2px solid var(--line);
    padding:6px 11px;font-size:12px;
  }
  .acts button:hover:not([disabled]){background:var(--btn);color:var(--btn-ink);border-color:var(--btn);filter:none}
  .acts button.armed{color:var(--danger);border-color:var(--danger)}
  .acts button.armed:hover{background:var(--danger);color:var(--ground);border-color:var(--danger)}

  /* ---- bonus ---- */
  .rewards{display:flex;flex-wrap:wrap;gap:6px}
  .rewards[hidden],.ovrewards[hidden]{display:none}
  .rewards button,.ovrewards button{
    display:inline-flex;align-items:center;gap:7px;padding:8px 12px;font-size:12.5px;
    background:var(--panel);color:var(--ink);border:2px solid var(--line);
  }
  .rewards button:hover:not([disabled]),.ovrewards button:hover:not([disabled]){
    background:var(--btn);color:var(--btn-ink);border-color:var(--btn);filter:none;
  }
  .rewards button.offer{
    background:var(--btn);color:var(--btn-ink);border-color:var(--btn);
    animation:offer 1.4s ease-in-out infinite;
  }
  .rewards button.offer .ad{background:var(--btn-ink);color:var(--btn)}
  @keyframes offer{0%,100%{box-shadow:0 0 0 0 rgba(143,122,102,0)}50%{box-shadow:0 0 0 5px rgba(143,122,102,.3)}}
  .ad{
    font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    background:var(--btn);color:var(--btn-ink);border-radius:2px;padding:2px 4px;line-height:1;
  }
  .rewards button:hover:not([disabled]) .ad,.ovrewards button:hover:not([disabled]) .ad{
    background:var(--btn-ink);color:var(--btn);
  }
  .ovrewards{display:flex;flex-direction:column;gap:8px;align-items:stretch}
  .ovrewards button{justify-content:center;background:transparent;color:var(--veil-ink);border-color:var(--veil-ink)}

  /* ---- classement ---- */
  .lb{display:flex;flex-direction:column;gap:8px;margin:0}
  .lb[hidden]{display:none}
  .lb h2{
    display:flex;align-items:baseline;gap:8px;margin:0;
    font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
  }
  .lb h2 span{font-size:11px;font-weight:500;letter-spacing:0;text-transform:none}
  .lb ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
  .lb li{
    display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:10px;
    background:var(--panel);border-radius:3px;padding:6px 10px;font-size:13px;
  }
  .lb .rk{color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
  .lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb b{font-weight:800;font-variant-numeric:tabular-nums}

  .publish{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
  .publish[hidden]{display:none}
  .publish input{
    font-family:inherit;font-size:14px;font-weight:600;padding:9px 12px;
    border:2px solid var(--veil-ink);border-radius:3px;background:transparent;
    color:var(--veil-ink);width:150px;
  }
  .publish input::placeholder{color:var(--veil-ink);opacity:.55}

  /* ---- le plateau ---- */
  .board{
    position:relative;width:100%;aspect-ratio:1/1;
    background:var(--board);border-radius:6px;
    touch-action:none;user-select:none;
    --gap:10px;--cell:80px;
  }
  .cell,.tile,.ghost{position:absolute;border-radius:3px}
  .cell{background:var(--cell-bg)}
  .tile{
    display:flex;align-items:center;justify-content:center;font-weight:800;
    font-variant-numeric:tabular-nums;letter-spacing:-.02em;
    transition:transform 150ms ease-in-out, opacity 150ms linear;z-index:2;
  }
  .tile.dying{z-index:1;opacity:.25}
  /* tuile qui va fusionner avec la pose en cours */
  .tile.match{box-shadow:0 0 0 3px var(--btn);z-index:4}
  /* tuile visée par le marteau */
  .tile.doomed{box-shadow:0 0 0 3px var(--danger);z-index:4}
  .board.smashing{cursor:crosshair}
  .ghost{
    z-index:3;pointer-events:none;opacity:.9;border:3px dashed var(--ghost-line);
    display:flex;align-items:center;justify-content:center;font-weight:800;
  }
  .ghost.bad{background:#c05a45;border-color:#eee4da;color:#f9f6f2}
  @keyframes pop{0%{transform:var(--tf) scale(.35);opacity:0}100%{transform:var(--tf) scale(1);opacity:1}}
  @keyframes bump{0%{transform:var(--tf) scale(1)}45%{transform:var(--tf) scale(1.2)}100%{transform:var(--tf) scale(1)}}
  .tile.new{animation:pop 150ms ease-out}
  .tile.merged{animation:bump 200ms ease-in-out}

  /* tuiles : les couleurs exactes du 2048 d'origine */
  .v2{background:#eee4da;color:#776e65}
  .v4{background:#ede0c8;color:#776e65}
  .v8{background:#f2b179;color:#f9f6f2}
  .v16{background:#f59563;color:#f9f6f2}
  .v32{background:#f67c5f;color:#f9f6f2}
  .v64{background:#f65e3b;color:#f9f6f2}
  .v128{background:#edcf72;color:#f9f6f2}
  .v256{background:#edcc61;color:#f9f6f2}
  .v512{background:#edc850;color:#f9f6f2}
  .v1024{background:#edc53f;color:#f9f6f2}
  .v2048{background:#edc22e;color:#f9f6f2;box-shadow:0 0 30px 10px rgba(243,215,116,.48)}
  .vbig{background:#3c3a32;color:#f9f6f2}

  .overlay{
    position:absolute;inset:0;border-radius:6px;z-index:10;
    background:var(--veil);color:var(--veil-ink);
    display:none;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;text-align:center;padding:22px;
  }
  .overlay.show{display:flex}
  .overlay h2{margin:0;font-size:clamp(34px,9vw,52px);font-weight:800;line-height:1;letter-spacing:-1px}
  .overlay p{margin:0;font-weight:500;font-size:14px;opacity:.9}
  .overlay button{background:var(--btn);color:var(--btn-ink);border:0;font-size:14px;padding:11px 20px}

  .float{
    position:absolute;right:10px;top:26px;font-weight:800;font-size:17px;color:var(--btn);
    opacity:0;pointer-events:none;white-space:nowrap;
  }
  @keyframes rise{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-20px)}}
  .float.go{animation:rise 760ms ease-out}
  .scorewrap{position:relative}

  @media (prefers-reduced-motion: reduce){
    .tile{transition:none}
    .tile.new,.tile.merged,.float.go,.rewards button.offer{animation:none}
    .float.go{opacity:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Domino 2048</h1>
      <p>Pose · Fusionne · Enchaîne</p>
    </div>
    <div class="scores">
      <div class="score scorewrap"><span>Score</span><b id="score">0</b><div class="float" id="float"></div></div>
      <div class="score"><span>Record</span><b id="best">0</b></div>
    </div>
  </header>

  <div class="panel">
    <div class="slot">
      <div class="lbl">À poser</div>
      <div id="cur"></div>
      <div class="arrowhint" id="hint">→</div>
    </div>
    <div class="slot next">
      <div class="lbl">Suivant</div>
      <div id="nxt"></div>
    </div>
    <button id="rotate" type="button" title="Fait tourner le domino"><span class="glyph">⟳</span>Pivoter</button>
  </div>

  <div class="bar">
    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="acts">
      <button id="forfeit" type="button" title="Met fin à la partie en cours">Déclarer forfait</button>
      <button id="restart" type="button" title="Repart de zéro">Nouvelle partie</button>
    </div>
  </div>

  <!-- Bonus : masqués tant qu'aucune régie publicitaire n'est branchée -->
  <div class="rewards" id="rewards" hidden>
    <button type="button" data-reward="undo">↺ Annuler le coup<span class="ad">pub</span></button>
    <button type="button" data-reward="swap">⇄ Changer de domino<span class="ad">pub</span></button>
    <button type="button" data-reward="hammer">✖ Retirer une tuile<span class="ad">pub</span></button>
    <button type="button" data-reward="boost" class="offer" hidden>×2 sur ce domino<span class="ad">pub</span></button>
  </div>

  <section class="lb" id="lb" hidden>
    <h2>Classement<span id="lbstate"></span></h2>
    <ol id="lblist"></ol>
  </section>

  <div class="board" id="board">
    <div class="overlay" id="overlay">
      <h2 id="ovtitle"></h2>
      <p id="ovtext"></p>
      <div class="ovrewards" id="ovrewards" hidden>
        <button type="button" data-reward="revive">↺ Continuer la partie<span class="ad">pub</span></button>
      </div>
      <form class="publish" id="publish" hidden>
        <input id="pubname" type="text" maxlength="16" placeholder="Ton pseudo"
               autocomplete="nickname" aria-label="Ton pseudo pour le classement">
        <button type="submit" id="pubbtn">Publier</button>
      </form>
      <div><button id="ovbtn" type="button"></button></div>
    </div>
  </div>
</div>

<script>
(function(){
"use strict";

const N = 6;
const ROTS   = [[0,1],[1,0],[0,-1],[-1,0]];   // droite, bas, gauche, haut
const ARROWS = ["→","↓","←","↑"];
const NB     = [[-1,0],[1,0],[0,-1],[0,1]];

const boardEl   = document.getElementById("board");
const overlayEl = document.getElementById("overlay");
const scoreEl   = document.getElementById("score");
const bestEl    = document.getElementById("best");
const floatEl   = document.getElementById("float");
const statusEl  = document.getElementById("status");
const curEl     = document.getElementById("cur");
const nxtEl     = document.getElementById("nxt");
const hintEl    = document.getElementById("hint");

let grid, tiles, score, best, phase, rot, piece, nextPiece, uid, won, placed, unlocked, justUnlocked;
let history, hammer, revives, paused, adBusy, games, forfeited;
let boostTurns, boostOffer;   // les deux moments où l'offre « ×2 » se présente
let published;                // score de la partie déjà envoyé au classement ?
let ads = null;                                 // régie publicitaire branchée, si build partenaire

/* ---------- mise en page ---------- */
let gap = 10, cell = 80;
function layout(){
  const w = boardEl.clientWidth;
  gap  = Math.max(6, Math.round(w * 0.022));
  cell = (w - gap * (N + 1)) / N;
  boardEl.style.setProperty("--gap", gap + "px");
  boardEl.style.setProperty("--cell", cell + "px");
  document.querySelectorAll(".cell,.tile,.ghost").forEach(el => {
    el.style.width = cell + "px";
    el.style.height = cell + "px";
  });
  boardEl.querySelectorAll(".cell").forEach(el => placeEl(el, +el.dataset.r, +el.dataset.c, true));
  for (const t of (tiles || [])) if (t.el) placeEl(t.el, t.r, t.c, true);
  document.querySelectorAll(".tile").forEach(el => el.style.fontSize = fontFor(el.textContent));
}
const px = i => gap + i * (cell + gap);
function placeEl(el, r, c, instant){
  const tf = "translate(" + px(c) + "px," + px(r) + "px)";
  el.style.setProperty("--tf", tf);
  if (instant){ const p = el.style.transition; el.style.transition = "none"; el.style.transform = tf; void el.offsetWidth; el.style.transition = p; }
  else el.style.transform = tf;
}
function fontFor(txt){
  const n = String(txt).length;
  return Math.round(cell * (n <= 2 ? 0.44 : n === 3 ? 0.34 : n === 4 ? 0.27 : 0.22)) + "px";
}
function cls(v){ return v <= 1024 ? "v" + v : (v === 2048 ? "v2048" : "vbig"); }
const inB   = (r,c) => r >= 0 && r < N && c >= 0 && c < N;
const sleep = ms => new Promise(res => setTimeout(res, ms));

/* ---------- le talon ----------
   Un numéro ne sort du talon qu'une fois débloqué, c'est-à-dire une fois qu'une
   fusion l'a fait apparaître sur le tapis : on commence avec des 2, le 4 arrive
   quand un 4 a été fabriqué, puis le 8, et ainsi de suite jusqu'à 64. Au-delà,
   les grosses tuiles ne se gagnent qu'en fusionnant.
   Le tirage penche vers le haut — le poids d'un numéro est sa valeur — sinon la
   matière distribuée reste trop maigre pour bâtir un 2048. */
const CAP = 64;
const DEAL_WEIGHT = "croissant";
// Hasard tenu à l'écart de Math.random : le talon est la seule chose qui doit
// consommer cette suite, sinon deux parties de même graine ne se rejouent plus
// à l'identique (c'est ce que vérifie tools/verify-sim.mjs).
function sideRand(max){
  if (window.crypto && crypto.getRandomValues){
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % max;
  }
  return Math.floor(Date.now() / 997) % max;
}
function unlock(v){
  if (v <= CAP && v > unlocked){ unlocked = v; justUnlocked = v; }
}
function dealValue(){
  const vals = [];
  for (let v = 2; v <= unlocked; v *= 2) vals.push(v);
  const total = vals.reduce((a,v) => a + v, 0);
  let x = Math.random() * total;
  for (const v of vals){ x -= v; if (x <= 0) return v; }
  return vals[vals.length - 1];
}
function makePiece(){ return { a: dealValue(), b: dealValue() }; }

/* ---------- tuiles ---------- */
function makeTile(t){
  const el = document.createElement("div");
  el.className = "tile " + cls(t.value) + " new";
  el.style.width = cell + "px"; el.style.height = cell + "px";
  el.textContent = t.value;
  el.style.fontSize = fontFor(t.value);
  boardEl.appendChild(el);
  t.el = el;
  placeEl(el, t.r, t.c, true);
  el.addEventListener("animationend", () => el.classList.remove("new","merged"));
}
function addTile(r, c, v){
  const t = { id: uid++, value: v, r, c };
  grid[r][c] = t; tiles.push(t);
  makeTile(t);
  return t;
}
function refresh(t, bump){
  t.el.textContent = t.value;
  t.el.className = "tile " + cls(t.value) + (bump ? " merged" : "");
  t.el.style.fontSize = fontFor(t.value);
  placeEl(t.el, t.r, t.c, false);
}

/* ---------- pièces (affichage) ---------- */
function pieceEl(p, r, small){
  const wrap = document.createElement("div");
  const vert = (r === 1 || r === 3);
  wrap.className = "piece" + (vert ? " vert" : "") + (small ? " small" : "");
  const vals = (r === 2 || r === 3) ? [p.b, p.a] : [p.a, p.b];
  for (const v of vals){
    const h = document.createElement("div");
    h.className = "half " + cls(v);
    h.textContent = v;
    wrap.appendChild(h);
  }
  return wrap;
}
function drawPieces(){
  curEl.innerHTML = ""; curEl.appendChild(pieceEl(piece, rot, false));
  nxtEl.innerHTML = ""; nxtEl.appendChild(pieceEl(nextPiece, 0, true));
  hintEl.textContent = ARROWS[rot];
}

/* ---------- règles de placement ---------- */
function cellsFor(r, c, rt){
  const [dr, dc] = ROTS[rt];
  return [[r,c],[r+dr,c+dc]];
}
// les voisines d'une case, en ignorant l'autre moitié du domino
function hooks(r, c, skipR, skipC, value){
  const out = [];
  for (const [dr,dc] of NB){
    const rr = r + dr, cc = c + dc;
    if (!inB(rr,cc) || (rr === skipR && cc === skipC)) continue;
    const t = grid[rr][cc];
    if (t && t.value === value) out.push(t);
  }
  return out;
}
// Le domino se pose partout où deux cases voisines sont libres. Une fois
// posées, ses deux moitiés ne sont plus solidaires : ce sont deux tuiles
// ordinaires, et seules les valeurs égales qui se touchent fusionnent.
// hooks[] sert uniquement à montrer d'avance ce qui va fusionner.
function tryPlace(r, c, rt, p){
  const cs = cellsFor(r, c, rt);
  if (!cs.every(([rr,cc]) => inB(rr,cc) && !grid[rr][cc]))
    return { ok:false, cells:cs, hooks:[] };
  const [[r1,c1],[r2,c2]] = cs;
  return { ok:true, cells:cs,
           hooks: hooks(r1,c1,r2,c2,p.a).concat(hooks(r2,c2,r1,c1,p.b)) };
}
// reste-t-il deux cases voisines libres ?
function canPlaceSomewhere(){
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    if (grid[r][c]) continue;
    for (const [dr,dc] of [[0,1],[1,0]]){
      const rr = r + dr, cc = c + dc;
      if (inB(rr,cc) && !grid[rr][cc]) return true;
    }
  }
  return false;
}

/* ---------- fusions en cascade ----------
   Une fusion ne réunit jamais que DEUX tuiles voisines de même valeur : la
   somme reste juste (4+4 = 8, jamais plus). Ce qu'on cherche, c'est de monter
   le plus haut possible : si un 2 peut devenir 4 puis 8 puis 16, on veut ce
   chemin-là. Deux choses se décident donc : quelle paire fusionner en premier,
   et sur laquelle de ses deux cases la fusion se dépose — car le survivant mal
   placé perd le contact avec la tuile suivante. */
const MAX_DEPTH = 24;
const MAX_NODES = 40000;

// photo du tapis : uniquement valeur + ancienneté, de quoi simuler
function snapshot(){
  return grid.map(row => row.map(t => t ? { v: t.value, id: t.id } : null));
}
// tous les coups possibles : chaque paire voisine de même valeur, et pour
// chacune les deux cases où la fusion peut se déposer
function listMoves(g){
  const out = [];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
    const t = g[r][c];
    if (!t) continue;
    for (const [dr,dc] of [[0,1],[1,0]]){
      const rr = r + dr, cc = c + dc;
      if (inB(rr,cc) && g[rr][cc] && g[rr][cc].v === t.v){
        out.push({ keep:[r,c],   gone:[rr,cc] });
        out.push({ keep:[rr,cc], gone:[r,c]   });
      }
    }
  }
  return out;
}
function applyMove(g, mv, nextId){
  const ng = g.map(row => row.slice());
  const v = ng[mv.keep[0]][mv.keep[1]].v * 2;
  ng[mv.keep[0]][mv.keep[1]] = { v, id: nextId };
  ng[mv.gone[0]][mv.gone[1]] = null;
  return { g: ng, nextId: nextId + 1, gained: v };
}

// longueur de la réaction en chaîne déclenchée par un coup : on ne poursuit
// qu'avec la tuile née de la fusion. Sert à jouer les fusions dans un ordre
// lisible, pas à décider du résultat.
function chainFrom(g, mv, nextId, left){
  const st = applyMove(g, mv, nextId);
  let best = { depth:0, gain:0 };
  if (left > 0){
    const [r,c] = mv.keep, v = st.g[r][c].v;
    for (const [dr,dc] of NB){
      const rr = r + dr, cc = c + dc;
      if (!inB(rr,cc)) continue;
      const o = st.g[rr][cc];
      if (!o || o.v !== v) continue;
      for (const nxt of [{ keep:[r,c], gone:[rr,cc] }, { keep:[rr,cc], gone:[r,c] }]){
        const sub = chainFrom(st.g, nxt, st.nextId, left - 1);
        if (sub.depth > best.depth || (sub.depth === best.depth && sub.gain > best.gain)) best = sub;
      }
    }
  }
  return { depth: 1 + best.depth, gain: st.gained + best.gain };
}

// Ce que le tapis peut encore donner, dans le meilleur ordre possible :
// d'abord la plus haute tuile atteignable, puis le score, puis le nombre de
// fusions.
function betterOutcome(a, b){
  if (a.peak  !== b.peak ) return a.peak  > b.peak;
  if (a.gain  !== b.gain ) return a.gain  > b.gain;
  return a.count > b.count;
}
function bestOutcome(g, nextId, budget){
  const ms = listMoves(g);
  if (!ms.length) return { peak:0, gain:0, count:0 };
  let best = null;
  for (const mv of ms){
    const st = applyMove(g, mv, nextId);
    let sub = { peak:0, gain:0, count:0 };
    if (budget.n > 0){ budget.n--; sub = bestOutcome(st.g, st.nextId, budget); }
    const cand = { peak: Math.max(st.gained, sub.peak),
                   gain: st.gained + sub.gain,
                   count: 1 + sub.count };
    if (!best || betterOutcome(cand, best)) best = cand;
  }
  return best;
}

// Le coup à jouer maintenant. Les trois premiers critères décident du résultat
// (monter le plus haut, puis marquer le plus, puis fusionner le plus) ; les
// suivants ne règlent que l'ordre d'affichage : poursuivre la cascade en cours,
// ouvrir la plus longue chaîne, laisser la tuile sur la case la plus récente,
// et jouer d'abord la plus grosse valeur.
function better(a, b){
  if (a.peak   !== b.peak  ) return a.peak   > b.peak;
  if (a.gain   !== b.gain  ) return a.gain   > b.gain;
  if (a.count  !== b.count ) return a.count  > b.count;
  if (a.chain  !== b.chain ) return a.chain  > b.chain;
  if (a.depth  !== b.depth ) return a.depth  > b.depth;
  if (a.recent !== b.recent) return a.recent > b.recent;
  return a.value > b.value;
}
function pickMove(g, nextId, from){
  const ms = listMoves(g);
  if (!ms.length) return null;
  const budget = { n: MAX_NODES };
  let best = null;
  for (const mv of ms){
    const st  = applyMove(g, mv, nextId);
    const sub = bestOutcome(st.g, st.nextId, budget);
    const on  = ([r,c]) => from && r === from[0] && c === from[1];
    const cand = {
      mv,
      peak  : Math.max(st.gained, sub.peak),
      gain  : st.gained + sub.gain,
      count : 1 + sub.count,
      chain : on(mv.keep) || on(mv.gone) ? 1 : 0,
      depth : chainFrom(g, mv, nextId, MAX_DEPTH).depth,
      recent: g[mv.keep[0]][mv.keep[1]].id > g[mv.gone[0]][mv.gone[1]].id ? 1 : 0,
      value : g[mv.keep[0]][mv.keep[1]].v
    };
    if (!best || better(cand, best)) best = cand;
  }
  return best;
}

async function resolve(){
  let chain = 0, total = 0, from = null;      // case née de la fusion précédente
  for(;;){
    const best = pickMove(snapshot(), uid, from);
    if (!best) break;
    const [kr,kc] = best.mv.keep, [gr,gc] = best.mv.gone;
    const anchor = grid[kr][kc], gone = grid[gr][gc];
    const value  = anchor.value * 2;

    grid[gr][gc] = null;
    tiles.splice(tiles.indexOf(gone), 1);
    gone.el.classList.add("dying");
    gone.r = kr; gone.c = kc;
    placeEl(gone.el, kr, kc, false);
    const el = gone.el;
    setTimeout(() => el.remove(), 170);
    await sleep(150);

    anchor.value = value;
    anchor.id = uid++;                          // la fusion devient la plus récente
    unlock(value);
    if (value >= 2048 && !won) won = "now";
    refresh(anchor, true);
    total += value; chain++;
    from = [kr,kc];
    await sleep(150);
  }
  if (total) addScore(total, chain);
  return chain;
}

/* ---------- tour de jeu ---------- */
async function place(r, c){
  if (phase !== "place" || paused) return;
  disarm();
  const res = tryPlace(r, c, rot, piece);
  if (!res.ok){ flash("Il faut deux cases voisines libres."); return; }
  phase = "anim";
  clearGhost();
  saveHistory();
  const [[r1,c1],[r2,c2]] = res.cells;
  addTile(r1, c1, piece.a);
  addTile(r2, c2, piece.b);
  placed++;
  piece = nextPiece; nextPiece = makePiece();
  drawPieces();
  await sleep(160);
  await resolve();
  nextTurn();
}
function nextTurn(){
  if (won === "now"){ won = true; showOverlay("2048 !", "Tu as monté la tuile. Continue : le 4096 existe, mais presque personne ne le voit.", "Continuer"); }
  if (!canPlaceSomewhere()){
    phase = "over";
    showOverlay("Le tapis est plein", "Score : " + score + " · " + placed + " dominos posés", "Rejouer");
  } else {
    phase = "place";
  }
  // l'offre porte sur le domino qu'on s'apprête à poser, et disparaît avec lui
  const offered  = phase === "place" && !!ads && boostTurns.includes(placed);
  const newOffer = offered && !boostOffer;
  boostOffer = offered;

  if (newOffer) flash("Offre : double ce domino avant de le poser.", "good");
  else if (justUnlocked && phase !== "over"){
    const v = justUnlocked; justUnlocked = null;
    flash("Le " + v + " est débloqué : il peut désormais sortir du talon.", "good");
  } else say();
  syncButtons(); syncRewards();
}

/* ---------- abandon et redémarrage ----------
   Les deux boutons mettent fin à une partie en cours : ils demandent donc une
   confirmation, mais seulement quand il y a quelque chose à perdre. Un second
   clic confirme, tout le reste annule. */
const restartBtn = document.getElementById("restart");
const forfeitBtn = document.getElementById("forfeit");
let armed = null, armTimer = null;

function disarm(){
  if (!armed) return;
  armed.el.textContent = armed.label;
  armed.el.classList.remove("armed");
  clearTimeout(armTimer);
  armed = null;
}
function arm(el, action, question){
  disarm();
  armed = { el, label: el.textContent, action };
  el.textContent = "Confirmer ?";
  el.classList.add("armed");
  flash(question);
  armTimer = setTimeout(() => { disarm(); say(); }, 5000);
}
function ask(el, action, question, needed){
  if (armed && armed.el === el){ const go = armed.action; disarm(); go(); return; }
  if (!needed){ disarm(); action(); return; }
  arm(el, action, question);
}
function forfeit(){
  forfeited = true;
  hammer = false; boardEl.classList.remove("smashing");
  clearGhost();
  phase = "over";
  showOverlay("Forfait", "Score : " + score + " · " + placed + " dominos posés", "Rejouer");
  syncButtons(); syncRewards(); say();
}
function syncButtons(){
  forfeitBtn.disabled = !(phase === "place" && placed > 0);
  syncPublish();
  if (armed && armed.el.disabled){ disarm(); say(); }
}
restartBtn.addEventListener("click", () => ask(restartBtn, newGame,
  "Partie en cours — clique encore pour tout effacer.",
  phase !== "over" && placed > 0));
forfeitBtn.addEventListener("click", () => ask(forfeitBtn, forfeit,
  "Clique encore pour abandonner la partie.",
  true));

/* ---------- score / messages ---------- */
function addScore(gained, chain){
  score += gained;
  scoreEl.textContent = score;
  if (score > best){ best = score; bestEl.textContent = best;
    try { localStorage.setItem("domino2048.best", best); } catch(e){} }
  floatEl.textContent = "+" + gained + (chain > 1 ? " · cascade ×" + chain : "");
  floatEl.classList.remove("go"); void floatEl.offsetWidth; floatEl.classList.add("go");
}
let flashTimer = null;
function flash(msg, tone){
  statusEl.textContent = msg;
  statusEl.classList.remove("warn","good");
  statusEl.classList.add(tone === "good" ? "good" : "warn");
  clearTimeout(flashTimer);
  flashTimer = setTimeout(say, 2400);
}
function say(){
  statusEl.classList.remove("warn","good");
  const free = N * N - tiles.length;
  statusEl.textContent =
    phase === "over" ? "Partie terminée." :
    free <= 6        ? "Plus que " + free + " cases libres." :
                       "À toi de jouer.";
}
function showOverlay(title, text, btn){
  document.getElementById("ovtitle").textContent = title;
  document.getElementById("ovtext").textContent = text;
  document.getElementById("ovbtn").textContent = btn;
  overlayEl.classList.add("show");
}

/* ---------- bonus ----------
   Effets débloquables par une pub récompensée. Le jeu ne connaît aucune régie :
   il expose des effets et un point de branchement (Domino.setAdProvider), la
   build partenaire fournit la régie. Sans régie, les boutons restent masqués et
   le jeu tourne exactement comme avant. */
const REWARDS = {
  undo:   { can: () => !!history && (phase === "place" || phase === "over") },
  swap:   { can: () => phase === "place" && !hammer },
  hammer: { can: () => phase === "place" && !hammer && tiles.length > 0 },
  revive: { can: () => phase === "over" && !forfeited && revives < 2 },
  // proposé seulement aux deux tours tirés au sort, et seulement pour ce domino-là
  boost:  { can: () => phase === "place" && boostOffer && !hammer }
};

function saveHistory(){
  history = {
    cells: grid.map(row => row.map(t => t ? t.value : 0)),
    score, unlocked, placed, rot,
    piece: { a: piece.a, b: piece.b },
    next : { a: nextPiece.a, b: nextPiece.b }
  };
}
function undoMove(){
  if (!history) return;
  const h = history; history = null;
  boardEl.querySelectorAll(".tile").forEach(e => e.remove());
  tiles = [];
  grid = Array.from({length:N}, () => Array(N).fill(null));
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++)
    if (h.cells[r][c]) addTile(r, c, h.cells[r][c]);
  score = h.score; scoreEl.textContent = score;
  unlocked = h.unlocked; placed = h.placed; rot = h.rot;
  piece = h.piece; nextPiece = h.next;
  overlayEl.classList.remove("show");
  hammer = false; boardEl.classList.remove("smashing");
  drawPieces(); clearGhost(); nextTurn();
  flash("Coup annulé.", "good");
}
// libère de la place au lieu de terminer : on retire les plus petites tuiles
// jusqu'à ce qu'un domino puisse de nouveau rentrer
function reviveBoard(){
  const order = tiles.slice().sort((a,b) => a.value - b.value);
  let removed = 0;
  while (order.length && removed < 8 && (removed < 3 || !canPlaceSomewhere())){
    const t = order.shift();
    grid[t.r][t.c] = null;
    tiles.splice(tiles.indexOf(t), 1);
    t.el.classList.add("dying");
    const el = t.el;
    setTimeout(() => el.remove(), 200);
    removed++;
  }
  revives++;
  history = null;
  overlayEl.classList.remove("show");
  phase = "place";
  nextTurn();
  flash(removed + " tuiles retirées — la partie continue.", "good");
}
function smash(r, c){
  const t = grid[r][c];
  if (!t){ flash("Vise une tuile à retirer."); return; }
  grid[r][c] = null;
  tiles.splice(tiles.indexOf(t), 1);
  t.el.classList.add("dying");
  const el = t.el;
  setTimeout(() => el.remove(), 200);
  hammer = false;
  boardEl.classList.remove("smashing");
  history = null;                        // plus rien à annuler après un retrait
  clearGhost(); nextTurn();
  flash("Tuile " + t.value + " retirée.", "good");
}
function grant(name){
  if (name === "undo")   return undoMove();
  if (name === "swap"){  piece = makePiece(); drawPieces(); clearGhost(); syncRewards();
                         return flash("Nouveau domino en main.", "good"); }
  if (name === "hammer"){ hammer = true; boardEl.classList.add("smashing"); clearGhost(); syncRewards();
                          return flash("Choisis la tuile à retirer.", "good"); }
  if (name === "revive") return reviveBoard();
  if (name === "boost"){
    piece = { a: piece.a * 2, b: piece.b * 2 };
    boostTurns = boostTurns.filter(t => t !== placed);   // offre consommée
    boostOffer = false;
  published = false;
    drawPieces(); clearGhost(); syncRewards();
    return flash("Domino doublé : " + piece.a + " et " + piece.b + ".", "good");
  }
}
function requestReward(name){
  if (!ads || adBusy || !REWARDS[name] || !REWARDS[name].can()) return;
  adBusy = true; syncRewards();
  const done = () => { adBusy = false; syncRewards(); };
  ads.showRewarded(name, {
    granted: () => { done(); grant(name); },
    skipped: msg => { done(); flash(msg || "Pas de récompense : la pub n'a pas été regardée jusqu'au bout."); }
  });
}
function syncRewards(){
  const bar = document.getElementById("rewards");
  const ov  = document.getElementById("ovrewards");
  bar.hidden = !ads;
  ov.hidden   = !ads || phase !== "over";
  if (!ads) return;
  document.querySelectorAll("[data-reward]").forEach(b => {
    const r = REWARDS[b.dataset.reward];
    b.disabled = adBusy || !r || !r.can();
  });
  const offer = document.querySelector('[data-reward="boost"]');
  offer.hidden = !REWARDS.boost.can() && !adBusy;
}
document.querySelectorAll("[data-reward]").forEach(b =>
  b.addEventListener("click", e => { e.stopPropagation(); requestReward(b.dataset.reward); }));

/* ---------- aperçu ---------- */
let ghosts = [];
function clearGhost(){
  ghosts.forEach(g => g.remove()); ghosts = [];
  boardEl.querySelectorAll(".tile.match,.tile.doomed").forEach(el => el.classList.remove("match","doomed"));
}
function showGhost(r, c){
  clearGhost();
  if (phase !== "place" || paused) return;
  if (hammer){
    const t = grid[r][c];
    if (t) t.el.classList.add("doomed");
    return;
  }
  const res = tryPlace(r, c, rot, piece);
  const vals = [piece.a, piece.b];
  res.cells.forEach(([rr,cc], i) => {
    if (!inB(rr,cc)) return;
    const g = document.createElement("div");
    g.className = "ghost " + (res.ok ? cls(vals[i]) : "bad");
    g.style.width = cell + "px"; g.style.height = cell + "px";
    g.style.fontSize = fontFor(vals[i]);
    g.textContent = res.ok ? vals[i] : "✕";
    boardEl.appendChild(g);
    placeEl(g, rr, cc, true);
    ghosts.push(g);
  });
  for (const t of res.hooks) t.el.classList.add("match");
}

/* ---------- classement ----------
   Le jeu ne dépend d'aucun serveur : sans adresse configurée, le panneau reste
   masqué et rien n'est envoyé. L'adresse se pose à la construction ci-dessous,
   ou à chaud via Domino.setLeaderboard(). Le serveur vit dans server/ (Worker
   Cloudflare + D1) ; il reçoit pseudo, score et nombre de coups, mais n'affiche
   jamais le nombre de coups — il ne sert qu'à repérer une partie douteuse. */
const LEADERBOARD_API = "";        // ex. "https://domino-2048-leaderboard.xxx.workers.dev"
let api = null;

function setLbState(msg){ document.getElementById("lbstate").textContent = msg || ""; }

async function loadBoard(){
  if (!api) return;
  try {
    const res = await fetch(api + "/scores?limit=10", { headers: { accept: "application/json" } });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const list = document.getElementById("lblist");
    list.textContent = "";
    for (const s of data.scores || []){
      const li = document.createElement("li");
      const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = s.rank;
      const nm = document.createElement("span"); nm.className = "nm";
      nm.textContent = s.name;                       // texte, jamais du HTML
      const sc = document.createElement("b");
      sc.textContent = Number(s.score).toLocaleString("fr-FR");
      li.append(rk, nm, sc);
      list.appendChild(li);
    }
    setLbState((data.scores || []).length ? "" : "personne encore");
  } catch {
    setLbState("indisponible");
  }
}

function syncPublish(){
  const form = document.getElementById("publish");
  form.hidden = !(api && phase === "over" && score > 0 && !published);
}

document.getElementById("publish").addEventListener("submit", async e => {
  e.preventDefault(); e.stopPropagation();
  const input = document.getElementById("pubname");
  const btn = document.getElementById("pubbtn");
  const name = input.value.trim();
  if (!name || !api){ input.focus(); return; }
  try { localStorage.setItem("domino2048.name", name); } catch(err){}
  btn.disabled = true; btn.textContent = "Envoi…";
  try {
    const res = await fetch(api + "/scores", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ name, score, moves: placed })
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || res.status);
    published = true;
    document.getElementById("ovtext").textContent =
      "Publié · " + data.rank + (data.rank === 1 ? "er" : "e") + " au classement";
    syncPublish();
    loadBoard();
  } catch (err){
    btn.disabled = false; btn.textContent = "Publier";
    setLbState("envoi impossible");
  }
});

function useLeaderboard(url){
  api = url ? String(url).trim().replace(/\/+$/, "") : null;
  document.getElementById("lb").hidden = !api;
  syncPublish();
  if (api) loadBoard();
}

/* ---------- entrées ---------- */
function cellFromPoint(x, y){
  const b = boardEl.getBoundingClientRect();
  const c = Math.floor((x - b.left - gap/2) / (cell + gap));
  const r = Math.floor((y - b.top  - gap/2) / (cell + gap));
  return inB(r,c) ? [r,c] : null;
}
function rotate(){ disarm(); if (paused || hammer) return; rot = (rot + 1) % 4; drawPieces(); clearGhost(); }

boardEl.addEventListener("mousemove", e => {
  const p = cellFromPoint(e.clientX, e.clientY);
  if (p) showGhost(p[0], p[1]); else clearGhost();
});
boardEl.addEventListener("mouseleave", clearGhost);
boardEl.addEventListener("click", e => {
  const p = cellFromPoint(e.clientX, e.clientY);
  disarm();
  if (!p || paused) return;
  if (hammer) smash(p[0], p[1]); else place(p[0], p[1]);
});
/* tactile : on glisse le doigt pour viser, on lève pour poser */
boardEl.addEventListener("touchstart", e => {
  const p = cellFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  if (p) showGhost(p[0], p[1]);
}, {passive:true});
boardEl.addEventListener("touchmove", e => {
  e.preventDefault();
  const p = cellFromPoint(e.touches[0].clientX, e.touches[0].clientY);
  if (p) showGhost(p[0], p[1]); else clearGhost();
}, {passive:false});
boardEl.addEventListener("touchend", e => {
  const p = cellFromPoint(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  const wasHammer = hammer;
  clearGhost();
  if (!p || paused) return;
  if (wasHammer) smash(p[0], p[1]); else place(p[0], p[1]);
}, {passive:true});

document.getElementById("rotate").addEventListener("click", rotate);
overlayEl.addEventListener("click", e => e.stopPropagation());
document.getElementById("ovbtn").addEventListener("click", e => {
  e.stopPropagation();
  if (phase === "over") newGame();
  else overlayEl.classList.remove("show");
});

document.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "r" || k === " " || k.startsWith("arrow")){ e.preventDefault(); rotate(); }
});
window.addEventListener("resize", layout);

/* ---------- démarrage ---------- */
function newGame(){
  grid = Array.from({length:N}, () => Array(N).fill(null));
  tiles = [];
  score = 0; uid = 1; rot = 0; won = false; placed = 0;
  unlocked = 2; justUnlocked = null;
  history = null; hammer = false; revives = 0; paused = false;
  forfeited = false; disarm();
  // deux offres par partie, à des tours tirés au hasard — assez tôt pour qu'une
  // partie courte les voie passer toutes les deux
  const first = 3 + sideRand(7);
  boostTurns = [first, first + 6 + sideRand(8)];
  boostOffer = false;
  published = false;
  boardEl.querySelectorAll(".tile,.ghost").forEach(e => e.remove());
  ghosts = [];
  piece = makePiece(); nextPiece = makePiece();
  overlayEl.classList.remove("show");
  phase = "place";
  scoreEl.textContent = "0";
  boardEl.classList.remove("smashing");
  drawPieces(); say(); syncButtons(); syncRewards();
  if (ads && games > 0) ads.showInterstitial("new-game");
  games++;
}
for (let r = 0; r < N; r++) for (let c = 0; c < N; c++){
  const d = document.createElement("div");
  d.className = "cell"; d.dataset.r = r; d.dataset.c = c;
  boardEl.appendChild(d);
}
games = 0; adBusy = false;
try {
  const saved = localStorage.getItem("domino2048.name");
  if (saved) document.getElementById("pubname").value = saved;
} catch(e){}
try { best = parseInt(localStorage.getItem("domino2048.best"), 10) || 0; } catch(e){ best = 0; }
bestEl.textContent = best;
newGame();
layout();
useLeaderboard(typeof window.DOMINO_API === "string" ? window.DOMINO_API : LEADERBOARD_API);

/* ---------- point de branchement pour une build partenaire ---------- */
window.Domino = {
  // régie : { showRewarded(nom, {granted, skipped}), showInterstitial(nom) }
  setAdProvider(provider){ ads = provider || null; syncRewards(); },
  // adresse du service de classement ; sans elle, aucun appel réseau
  setLeaderboard(url){ useLeaderboard(url); },
  pause (){ paused = true; },
  resume(){ paused = false; },
  state (){ return { score, best, placed, phase, unlocked, tiles: tiles.length, revives,
                     boostOffer, boostTurns: boostTurns.slice() }; },
  newGame
};
window.dispatchEvent(new Event("domino.ready"));
})();
</script>
</body>
