# Déploiement du classement depuis le dépôt : chaque push sur la branche
# principale qui touche server/ rejoue les tests puis redéploie le Worker.
#
# Deux secrets à poser dans Settings → Secrets and variables → Actions :
#   CLOUDFLARE_API_TOKEN   (gabarit « Edit Cloudflare Workers »)
#   CLOUDFLARE_ACCOUNT_ID
name: Déployer le classement

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-leaderboard.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester le Worker
        working-directory: server
        run: node --experimental-sqlite test/worker.test.mjs

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Déployer sur Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
