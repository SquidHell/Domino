# Met le classement en ligne sans toucher à un terminal : tout se fait depuis
# l'onglet Actions de GitHub, y compris sur un téléphone.
#
# Deux secrets à poser une fois dans Settings → Secrets and variables → Actions :
#   CLOUDFLARE_API_TOKEN   (gabarit « Edit Cloudflare Workers », avec D1:Edit)
#   CLOUDFLARE_ACCOUNT_ID
# Un troisième, facultatif :
#   ADMIN_TOKEN            (sans lui, les routes /admin répondent 503)
#
# Le travail complet est fait ici : la base D1 est créée si elle n'existe pas,
# son identifiant est écrit dans wrangler.toml, le schéma est appliqué, le
# Worker est déployé, puis l'adresse obtenue est recopiée dans le jeu et validée
# dans le dépôt. Rien à faire à la main entre deux étapes.
name: Déployer le classement

on:
  workflow_dispatch:
    inputs:
      sous_domaine:
        description: "Sous-domaine workers.dev à enregistrer, si ce n'est pas déjà fait (lettres, chiffres, tirets — les majuscules sont mises en minuscules). Le classement vivra sur https://domino-2048-leaderboard.<ce-nom>.workers.dev"
        required: false
        default: ""
  push:
    branches: [claude/html-domino-2048-game-8msl8i, main]
    paths: ['server/**', '.github/workflows/deploy-leaderboard.yml']

concurrency:
  group: classement
  cancel-in-progress: false

jobs:
  test:
    name: Tests du Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 38 vérifications, sans réseau
        working-directory: server
        run: node --experimental-sqlite test/worker.test.mjs

  deploy:
    name: Mise en ligne
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write          # pour réécrire l'adresse du classement dans le jeu
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BASE: domino-2048
      W: npx --yes wrangler@4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier les secrets
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN manque (Settings → Secrets and variables → Actions)"; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID manque (Settings → Secrets and variables → Actions)"; exit 1; }

      # Un jeton valide mais trop étroit échoue plus loin sur une « Authentication
      # error » qui n'apprend rien. On éprouve les deux droits nécessaires ici, et
      # on dit lequel manque.
      - name: Éprouver les droits du jeton
        run: |
          set -uo pipefail
          panne=0
          if ! SORTIE="$($W d1 list --json 2>&1)"; then
            printf '%s\n' "$SORTIE"
            echo "::error::Le jeton n'a pas le droit d'agir sur les bases D1. Ajoute l'autorisation « Compte → D1 → Edit » : dash.cloudflare.com → menu du compte → Mes profils → Jetons d'API → sur ton jeton, Modifier → Ajouter davantage → Compte / D1 / Edit → Continuer → Enregistrer."
            panne=1
          else
            echo "D1 : accessible."
          fi
          exit $panne

      - name: Base D1 — la retrouver ou la créer
        working-directory: server
        run: |
          set -euo pipefail
          id_base(){
            $W d1 list --json 2>/dev/null | BASE="$BASE" node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                let l=[]; try { l = JSON.parse(s); } catch(e){ return; }
                const m = (Array.isArray(l)?l:[]).find(d => d.name === process.env.BASE);
                if (m) process.stdout.write(String(m.uuid || m.database_id || ""));
              });'
          }
          ID="$(id_base || true)"
          if [ -z "$ID" ]; then
            echo "création de « $BASE »…"
            if ! SORTIE="$($W d1 create "$BASE" 2>&1)"; then
              printf '%s\n' "$SORTIE"
              echo "::error::Création de la base D1 refusée. C'est presque toujours l'autorisation « Compte → D1 → Edit » qui manque au jeton."
              exit 1
            fi
            printf '%s\n' "$SORTIE"
            ID="$(id_base || true)"
          else
            echo "« $BASE » existe déjà, on la réutilise."
          fi
          [ -n "$ID" ] || { echo "::error::identifiant de la base introuvable"; exit 1; }
          echo "identifiant : $ID"
          ID="$ID" node -e '
            const fs = require("fs");
            const t = fs.readFileSync("wrangler.toml", "utf8");
            const n = t.replace(/^database_id = .*$/m, `database_id = "${process.env.ID}"`);
            if (n !== t) fs.writeFileSync("wrangler.toml", n);
          '

      - name: Schéma
        working-directory: server
        # CREATE ... IF NOT EXISTS : rejouer ne perd aucune ligne du classement
        run: $W d1 execute "$BASE" --remote --file=./schema.sql --yes

      - name: Jeton d'administration
        working-directory: server
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -n "${ADMIN_TOKEN:-}" ]; then
            printf '%s' "$ADMIN_TOKEN" | $W secret put ADMIN_TOKEN
            echo "ADMIN_TOKEN posé."
          else
            echo "Pas de secret ADMIN_TOKEN : les routes /admin resteront en 503."
          fi

      # Un compte neuf n'a pas de sous-domaine workers.dev, et sans lui aucun Worker
      # ne peut être publié. wrangler ne sait que le demander de façon interactive,
      # donc jamais dans une exécution automatique : on passe par l'API.
      - name: Sous-domaine workers.dev
        if: inputs.sous_domaine != ''
        env:
          NOM: ${{ inputs.sous_domaine }}
        run: |
          set -uo pipefail
          # Les majuscules et les espaces autour sont des coquilles, pas des choix :
          # on les corrige au lieu de renvoyer le joueur à son formulaire.
          BRUT="$NOM"
          NOM="$(printf '%s' "$NOM" | tr 'A-Z' 'a-z' | tr -d '[:space:]')"
          [ "$NOM" = "$BRUT" ] || echo "« $BRUT » normalisé en « $NOM »."
          case "$NOM" in
            *[!a-z0-9-]*|-*|*-|"")
              echo "::error::« $BRUT » ne peut pas servir de sous-domaine : seuls les lettres, les chiffres et les tirets sont acceptés, sans commencer ni finir par un tiret."
              exit 1 ;;
          esac
          REP="$(curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"subdomain\":\"$NOM\"}")"
          printf '%s\n' "$REP"
          if printf '%s' "$REP" | grep -q '"success":true'; then
            echo "sous-domaine « $NOM » enregistré."
          else
            echo "::error::Cloudflare a refusé le sous-domaine « $NOM » — la réponse complète est juste au-dessus. Le plus souvent : le nom est déjà pris par un autre compte, ou un sous-domaine existe déjà (dans ce cas relance sans remplir ce champ)."
            exit 1
          fi

      - name: Déployer le Worker
        id: deploiement
        working-directory: server
        run: |
          # surtout pas « set -e » ici : une affectation qui échoue couperait le
          # script avant qu'on ait pu montrer ce que wrangler avait à dire
          set -uo pipefail
          if ! SORTIE="$($W deploy 2>&1)"; then
            printf '%s\n' "$SORTIE"
            case "$SORTIE" in
              *subdomain*|*"workers.dev"*)
                echo "::error::Ton compte n'a pas encore de sous-domaine workers.dev — il s'en choisit un une seule fois, et sans lui aucun Worker ne peut être publié. Relance ce workflow en remplissant le champ « Sous-domaine workers.dev » du formulaire Run workflow : il sera enregistré automatiquement." ;;
              *[Aa]uthentication*|*10000*|*[Ff]orbidden*|*[Uu]nauthorized*)
                echo "::error::Le jeton n'a pas le droit de déployer un Worker. Ajoute l'autorisation « Compte → Workers Scripts → Edit »." ;;
              *)
                echo "::error::Le déploiement a échoué. Le détail de wrangler est juste au-dessus." ;;
            esac
            exit 1
          fi
          printf '%s\n' "$SORTIE"
          URL="$(printf '%s' "$SORTIE" | grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' | head -1)"
          if [ -z "$URL" ]; then
            echo "::error::Worker déployé, mais son adresse est illisible dans la sortie ci-dessus."
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Vérifier que le service répond
        run: |
          set -euo pipefail
          URL="${{ steps.deploiement.outputs.url }}"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$URL/health" | grep -q '"ok"'; then
              echo "sonde de santé : d'accord."; exit 0
            fi
            echo "pas encore prêt, nouvel essai dans 5 s…"; sleep 5
          done
          echo "::error::le Worker ne répond pas sur $URL/health"; exit 1

      - name: Brancher le jeu sur le classement
        id: branchement
        run: |
          set -euo pipefail
          URL="${{ steps.deploiement.outputs.url }}" node -e '
            const fs = require("fs");
            const t = fs.readFileSync("index.html", "utf8");
            const n = t.replace(/const LEADERBOARD_API = "[^"]*";/,
                                `const LEADERBOARD_API = "${process.env.URL}";`);
            if (n === t){ console.error("ligne LEADERBOARD_API introuvable"); process.exit(1); }
            fs.writeFileSync("index.html", n);
          '
          [ -f tools/build-y8.py ] && python3 tools/build-y8.py || true
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html y8/index.html server/wrangler.toml
          if git diff --cached --quiet; then
            echo "rien à valider : le jeu pointait déjà au bon endroit."
            echo "branche=oui" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Classement en ligne : ${{ steps.deploiement.outputs.url }} [skip ci]"
          # Le service est en ligne : ce commit n'est que de la comptabilité. S'il
          # est refusé (droits d'écriture des Actions en lecture seule), on le dit
          # sans faire passer pour un échec un déploiement qui a réussi.
          if git push origin HEAD:"${{ github.ref_name }}"; then
            echo "adresse validée dans le dépôt."
            echo "branche=oui" >> "$GITHUB_OUTPUT"
          else
            echo "branche=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Le Worker est bien en ligne, mais l'adresse n'a pas pu être écrite dans le dépôt : les Actions n'ont pas le droit d'y pousser. Settings → Actions → General → Workflow permissions → « Read and write permissions ». À défaut, recopie l'adresse à la main dans index.html (const LEADERBOARD_API)."
          fi

      - name: Récapitulatif
        run: |
          URL="${{ steps.deploiement.outputs.url }}"
          {
            echo "## Classement en ligne"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Classement public | \`$URL/scores\` |"
            echo "| Sonde de santé | \`$URL/health\` |"
            echo "| Dépôt d'un score | \`POST $URL/scores\` |"
            echo
            if [ "${{ steps.branchement.outputs.branche }}" = "oui" ]; then
              echo "Le jeu a été mis à jour dans le dépôt : il pointe maintenant sur cette adresse."
            else
              echo "**Il reste une chose à faire.** Le service est en ligne, mais l'adresse n'a pas pu"
              echo "être écrite dans le dépôt. Ouvre \`Settings → Actions → General → Workflow permissions\`,"
              echo "choisis « Read and write permissions », et relance ce workflow — ou recopie l'adresse"
              echo "ci-dessus à la main dans \`index.html\` (ligne \`const LEADERBOARD_API\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
