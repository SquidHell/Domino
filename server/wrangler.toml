name = "domino-2048-leaderboard"
main = "src/index.js"
compatibility_date = "2026-08-01"

# La base D1 : créée une fois avec `npx wrangler d1 create domino-2048`,
# puis on recopie ici l'identifiant qu'affiche la commande.
[[d1_databases]]
binding = "DB"
database_name = "domino-2048"
database_id = "à-remplacer-après-wrangler-d1-create"

# ADMIN_TOKEN n'est pas ici : c'est un secret.
#   npx wrangler secret put ADMIN_TOKEN
# Tant qu'il n'est pas posé, les routes /admin répondent 503 au lieu de s'ouvrir.
